# Validated South-ece reconstruction settings. Intrinsics come from Kalibr.
model_name: da
torch_compile: false
use_slam: false
is_mono: false
trajectory: visloc
slam_trajectory_topic: null
slam_final_trajectory_topic: null
slam_odometry_topic: null
slam_image_topic: /visloc/rgb/rectified/compressed
image_pose_timestamp_tolerance_sec: 0.005
frame_scale_opt: true
submap_scale_opt: true
point_cloud_fusion: true
select_kf_on_time: true
sec_skip: 0.2
kf_distance: 0.5
kf_distance_large: 1.0
kf_angle_deg: 10
max_distance: 0
num_ref_poses_per_batch: 4
num_ref_poses_per_submap: 4
overlap_ref_views: 1
publish_ros2_pointcloud: false
publish_ros2_path: false
publish_ros2_images: false
depth_model_dtype: float32
depth_process_res: 336
