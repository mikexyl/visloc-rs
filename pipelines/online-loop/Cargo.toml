[package]
name = "visloc-online-loop"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Online JIST, XFeat and LighterGlue loop closure alongside metric VIO"

[features]
default = []
native = ["visloc-tensorrt/native"]

[dependencies]
nalgebra.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
visloc-core = { path = "../../crates/core" }
visloc-vision = { path = "../../crates/vision" }
visloc-slam = { path = "../slam" }
visloc-tensorrt = { path = "../../crates/tensorrt-runtime" }
