[package]
name = "visloc-multi-robot"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
description = "SB-SLAM sequence refinement and centralized multi-robot SE(3) SLAM"

[features]
default = []
native = ["dep:visloc-online-loop", "visloc-online-loop/native", "dep:sha2"]

[dependencies]
nalgebra.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
visloc-core = { path = "../../crates/core" }
visloc-vision = { path = "../../crates/vision" }
visloc-slam = { path = "../slam" }
visloc-online-loop = { path = "../online-loop", optional = true }
sha2 = { workspace = true, optional = true }
